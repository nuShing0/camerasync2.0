name: camerasync_mobile
description: 8kount — record practices from several phones at once and review every angle together.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  video_player: ^2.14.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  external_display: ^0.4.3
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  video_compress: ^3.1.4
  mobile_scanner: ^7.4.3
  qr_flutter: ^4.1.0
  app_links: ^7.2.2

# Project copies of the camera plugins with one addition each: they report
# when a recording's first frame was captured (see packages/*/README-8kount).
dependency_overrides:
  camera_android_camerax:
    path: packages/camera_android_camerax
  camera_avfoundation:
    path: packages/camera_avfoundation

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# App icons for Android and iOS, from the 8kount logo:
#   dart run flutter_launcher_icons
# Android crops icons into circles and squircles; the tool insets the
# adaptive icon's foreground so the logo stays inside the crop, on black.
# Afterwards, check that ios/Runner.xcodeproj/project.pbxproj still says
# ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES (the
# tool has a bug that overwrites it with AppIcon).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
